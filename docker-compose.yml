services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${DB_USER:?DB_USER is not set - see .env.example}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is not set - see .env.example}
      POSTGRES_DB: ${DB_NAME:?DB_NAME is not set - see .env.example}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:?DB_USER is not set} -d ${DB_NAME:?DB_NAME is not set}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DB_CONNECTION_STRING: postgresql+asyncpg://${DB_USER:?DB_USER is not set}:${DB_PASSWORD:?DB_PASSWORD is not set}@db:5432/${DB_NAME:?DB_NAME is not set}
      REDIS_URL: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  db_data:
